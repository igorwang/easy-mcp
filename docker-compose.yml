services:
  easy-mcp:
    container_name: easy-mcp
    restart: always
    env_file:
      - .env
    build: .
    command: ["uv", "run", "main.py", "--host", "0.0.0.0", "--port", "${PORT:-8000}"]
    ports:
      - ${PORT:-8000}:${PORT:-8000}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT:-8000}/health"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s